# Deploys to Cloudflare only after CI succeeds for a push to main, and only
# the exact commit CI tested. Pull requests never deploy.
#
# Required (Settings -> Secrets and variables -> Actions, "production" environment):
#   secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variables: ACCESS_TEAM_DOMAIN, ACCESS_AUD   (Cloudflare Access for the web UI)
# The agents' private keys are NOT stored in GitHub: they are Worker secrets,
# set once with `npm run deploy` from your machine. This job verifies they exist.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    # All three conditions matter:
    #  - CI passed (tests, coverage, audit and CodeQL all green)
    #  - it was a push, not a pull request (a fork PR from a branch named
    #    "main" also reports head_branch == main)
    #  - the code came from this repository, not a fork
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Optional: add required reviewers to this environment for a manual
    # approval step before each production deploy.
    environment: production
    defaults:
      run:
        working-directory: agent-auth
    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # If two pushes land close together, their CI runs can finish out of
      # order. Only deploy if this commit is still the tip of main, so an
      # older commit can never overwrite a newer deploy.
      - name: Skip if main has moved on
        id: fresh
        working-directory: .
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$tip" = "$TESTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $tip, not $TESTED_SHA; the newer commit will deploy itself." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.fresh.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-auth/package-lock.json

      - name: Install
        if: steps.fresh.outputs.deploy == 'true'
        run: npm ci

      - name: Deploy all Workers and verify their secrets
        if: steps.fresh.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
        run: npm run deploy -- --code-only
